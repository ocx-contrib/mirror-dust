name: dbg
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - run: |
          for n in 2 5; do gh api repos/$REPO/issues/$n --jq '"\(.number) \(.author_association)"'; done
          gh api repos/$REPO/collaborators/michael-herwig/permission --jq .permission || true
          gh api orgs/ocx-contrib/members/michael-herwig -i | head -1 || true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
