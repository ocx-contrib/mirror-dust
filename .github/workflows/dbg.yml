name: dbg
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ASSOC=$A ACTOR=$B"
        env:
          A: ${{ github.event.issue.author_association }}/${{ github.event.comment.author_association }}
          B: ${{ github.actor }}
