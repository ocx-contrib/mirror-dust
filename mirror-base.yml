# Repo-wide policy for the dust mirror.
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# bin_scan, metadata, catalog, tests, versions, announce, annotations — stays
# in dust/mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. This repo
# is single-package, so `platforms:` lives HERE and dust/mirror.yml does not
# restate it — the trap is structurally eliminated rather than merely avoided.

skip_prereleases: true
cascade: true

# New package, so the fleet rule applies unconditionally. A cascade tag
# (`latest`, `1`, `1.2`) re-points on every re-publish; without a build segment
# the new manifest reuses the bare version tag and orphans the prior digest for
# registry GC, breaking any `@sha256:` pin in a consumer's ocx.lock. The `none`
# exception applies only where upstream versions ALREADY carry semver build
# metadata — dust tags bare semver behind a `v` (`v1.2.4` → `1.2.4`), so it
# does not.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # Assets are ~1.1–1.3 MB archives around a single binary plus LICENSE/README.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built, and a musl target TRIPLE is not a musl
# requirement. Upstream ships BOTH a `-gnu` and a `-musl` build for x86_64 and
# aarch64 Linux. The musl build was byte-measured on BOTH arches at BOTH ends
# of the range (1.2.2 and 1.2.4) and is fully static on all four — INTERP
# segment count 0, zero DT_NEEDED (evidence above dust/mirror.yml's `assets:`).
# It therefore requires nothing of the host, so BOTH Linux keys are BARE and
# both carry the musl asset. `+libc.musl` would be a false requirement that hid
# the package from every glibc host it in fact runs on.
#
# The gnu builds are genuinely dynamic (interpreter + libc.so.6 + libgcc_s.so.1,
# max symbol GLIBC_2.18 on both arches) and are deliberately NOT carried: dust
# is a local-filesystem tool, so the one real reason to publish a second
# `+libc.glibc` key alongside a static build — musl's resolver ignoring
# nsswitch.conf for a NETWORK tool — does not apply here. One artifact per arch,
# universally resolvable.
#
# A bare key claims universality, so it must prove it: ubuntu (glibc) + alpine
# (musl) + fedora (other glibc vintage). The ALPINE LEG IS THE PROOF — drop it
# and the claim is merely asserted.
#
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.
  #
  # darwin/arm64 and windows/arm64 arrive upstream at v1.2.5 — 1.2.2–1.2.4
  # ship neither — so both are bounded by `min_version` rather than left to
  # match zero assets on the older releases.
  darwin/arm64:
    # Native Apple Silicon build on the arm64 macos-14 runner — no prefix.
    runner: macos-14
    min_version: "1.2.5"
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 —
    # GitHub's native macos-13 Intel pool is exhausted and deadlocks push.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    runner: windows-11-arm
    shell: pwsh
    min_version: "1.2.5"

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
